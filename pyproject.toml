[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omo-slim-preset-switcher"
version = "0.1.0"
description = "Lightweight multi-project preset manager for oh-my-opencode-slim"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
omo-slim-presets = "omo_slim_preset_switcher.app:main"

[tool.setuptools.packages.find]
where = ["src"]
