name: Publish v0.1.0 and cleanup branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.0-and-cleanup.yml

permissions:
  contents: write

jobs:
  publish-and-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: b0e355a16e193c8566552fe0a576a8ee3fc900f3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Validate and build
        run: |
          python -m pip install build==1.6.1
          python -m pip install .
          python -m unittest discover -s tests -v
          python -m build

      - name: Publish v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/release-notes.md <<'EOF'
          ## Initial release

          OMO Slim Preset Switcher is a lightweight desktop utility for managing
          oh-my-opencode-slim preset selection across multiple projects.

          ### Highlights

          - global and project-local preset controls
          - explicit **Inherit global** behavior
          - effective-preset display with environment override awareness
          - JSONC comment/format preservation
          - atomic configuration and settings writes
          - multi-root project discovery
          - zero third-party runtime dependencies
          - Tkinter desktop UI
          - tested on Python 3.11 and 3.14 across Windows and Ubuntu

          This release includes both a Python wheel and source distribution.
          EOF

          gh release create v0.1.0 dist/*             --target b0e355a16e193c8566552fe0a576a8ee3fc900f3             --title "v0.1.0 — Initial release"             --notes-file /tmp/release-notes.md             --latest

      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            "validate/current-main"
            "validate/global-inherit-current"
            "validate/global-project-scope"
            "validate/hardening-ci"
            "validate/initial-ci"
            "validate/scoped-presets"
            "validate/scoped-presets-v2"
            "validate/scoped-ui-ci"
            "chore/project-polish"
          )

          for branch in "${branches[@]}"; do
            ref="repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            if gh api "$ref" >/dev/null 2>&1; then
              gh api --method DELETE "$ref"
            fi
          done
